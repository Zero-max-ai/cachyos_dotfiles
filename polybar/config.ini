[colors]
background = #CC111111
foreground = #eeeeee
primary = #ffffff
alert = #f38ba8
dim = #6c7086

[bar/top]
monitor =
width = 100%
height = 28
radius = 0
bottom = false
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = Hack Nerd Font:size=9;3
font-1 = Symbols Nerd Font:size=10;3

modules-left = xworkspaces
modules-center = time
modules-right = backlight pulseaudio battery wifi date

cursor-click = pointer
enable-ipc = true
override-redirect = false

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false
enable-click = true
enable-scroll = true
reverse-scroll = true

label-active = %index%
label-active-foreground = ${colors.primary}
label-active-underline = ${colors.primary}
label-active-padding = 1

label-occupied = %index%
label-occupied-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-empty = %index%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

[module/time]
type = internal/date
interval = 1
time = %H:%M:%S
label = %time%

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true
interval = 5
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰝟 muted
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT1
adapter = AC
full-at = 100
low-at = 10
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
format-low = <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 %percentage%%
label-low = 󰂃 %percentage%%
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹

animation-charging-0 = 󰢜
animation-charging-1 = 󰂇
animation-charging-2 = 󰢝
animation-charging-3 = 󰂅
animation-charging-framerate = 750

[module/wifi]
type = internal/network
interface = wlan0
interface-type = wireless
interval = 3

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%
format-disconnected = 󰤭 offline
format-disconnected-foreground = ${colors.dim}

ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨

[module/date]
type = internal/date
interval = 60
date = %a %d %b
label = %date%

[settings]
screenchange-reload = true
pseudo-transparency = true
