[general]
live_config_reload = true
import = [
  "~/.config/alacritty/themes/themes/catppuccin_mocha.toml"
]

[window]
# blur = true
opacity = 0.85
padding = { x = 14, y = 12 }
dynamic_padding = true
dynamic_title = true
decorations = "None"

[font]
size = 11.0
offset = { x = 0, y = 1 }

[font.normal]
family = "Hack Nerd Font"
style = "Bold"

[font.bold]
style = "Bold"

[colors.primary]
# background = "#1d2021"
# foreground = "#ebdbb2"

[cursor]
style = { shape = "Underline", blinking = "On" }
unfocused_hollow = true
thickness = 0.5
