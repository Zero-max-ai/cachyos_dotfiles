# ---------- Backend ----------
backend = "glx";
vsync = true;
use-damage = true;

# ---------- Shadows ----------
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";

shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'xwinwrap'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ---------- Rounded corners ----------
corner-radius = 12;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'xwinwrap'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ---------- Blur ----------
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [
  "class_g = 'xwinwrap'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ---------- Fading ----------
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;

# ---------- Opacity ----------
inactive-opacity = 1.0;
frame-opacity = 1.0;
opacity-rule = [
  "90:class_g = 'Alacritty'"
];

# ---------- Window types ----------
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.95; };
  dock          = { shadow = false; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};

# ---------- General ----------
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
